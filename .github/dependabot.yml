version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    labels:
      - dependencies
    schedule:
      interval: weekly
    groups:
      minor-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor

  - package-ecosystem: npm
    directory: /frontend
    labels:
      - dependencies
    schedule:
      interval: weekly
    groups:
      minor-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
    ignore:
      # Angular pins its supported TypeScript range; take TypeScript majors together with an Angular upgrade
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    labels:
      - dependencies
    schedule:
      interval: weekly
    groups:
      minor-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
    ignore:
      # Keep the Node and Java runtime image versions pinned until upgraded intentionally.
      - dependency-name: "node"
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"

  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
    schedule:
      interval: weekly
    groups:
      minor-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
