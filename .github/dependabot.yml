version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    ignore:
      # Angular pins its supported TypeScript range; take TypeScript majors together with an Angular upgrade
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    ignore:
      # Keep the Node and Java runtime image versions pinned until upgraded intentionally.
      - dependency-name: "node"
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
