name: Build and deploy

on:
  push:
    branches: [main]
    # The tag bump below only touches helm/; don't rebuild for it
    paths-ignore:
      - "helm/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: repo.repsy.io
  IMAGE: repo.repsy.io/firat/apps/funbuild
  FRONTEND_IMAGE: repo.repsy.io/firat/apps/funbuild-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B verify

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build and tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx ng test --watch=false

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REPSY_USERNAME }}
          password: ${{ secrets.REPSY_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Published to Cloudflare Pages by cfpo; the CloudflarePage in helm/ references it with the same tag
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump image tag in Helm values
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          sed -i -E "s|^(  tag: ).*|\1${TAG}|" helm/values.yaml
          if git diff --quiet; then
            echo "Tag already ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy funbuild ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
