name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  # Required when GitHub merge queue is enabled: it validates each queued merge.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorconfig:
    name: EditorConfig
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure there is one repository-wide EditorConfig file
        run: test "$(find . -name .editorconfig | wc -l)" = "1"

      - name: Check EditorConfig formatting
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

  backend:
    name: Backend tests and coverage
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize repsy-core
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and verify
        working-directory: backend
        run: |
          ./mvnw -B -ntp -f ../core/pom.xml install -DskipTests -Dcheckstyle.skip=true
          ./mvnw -B -ntp verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml
          if-no-files-found: error

  frontend:
    name: Frontend build and tests
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test with coverage
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test:coverage

      - name: Normalize LCOV source paths for repository analysis
        run: sed -i 's|^SF:src/|SF:frontend/src/|' frontend/coverage/frontend/lcov.info

      - name: Upload frontend LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-lcov-report
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud analysis
    needs: [backend, frontend]
    # Dependabot PRs cannot access repository secrets. Main is analysed after merge.
    if: github.actor != 'dependabot[bot]' && github.event_name != 'merge_group'
    runs-on: warp-ubuntu-latest-x64-2x
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize repsy-core
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile backend classes for analysis
        working-directory: backend
        run: |
          ./mvnw -B -ntp -f ../core/pom.xml install -DskipTests -Dcheckstyle.skip=true
          ./mvnw -B -ntp test-compile -DskipTests

      - name: Download JaCoCo report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Download frontend LCOV report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-lcov-report
          path: frontend/coverage/frontend

      - name: Analyze applications with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
