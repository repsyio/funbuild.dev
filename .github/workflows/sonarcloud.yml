name: SonarCloud Analysis

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze main branch
    runs-on: warp-ubuntu-latest-x64-2x
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend and generate JaCoCo coverage
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: Build frontend and generate LCOV coverage
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test:coverage

      - name: Normalize LCOV source paths for repository analysis
        run: sed -i 's|^SF:src/|SF:frontend/src/|' frontend/coverage/frontend/lcov.info

      - name: Upload frontend LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-lcov-report
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error

      - name: Analyze applications with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
