<h1 class="mb-6 text-2xl font-semibold">Projects</h1>

@if (loading()) {
  <div class="flex justify-center py-12">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
} @else {
  <div class="grid gap-4">
    @for (project of projects(); track project.id) {
      @if (editingId() === project.id) {
        <app-project-form [existingProject]="project" (saved)="onSaved()" (cancelled)="editingId.set(null)" />
      } @else {
        <div class="card bg-base-100 shadow">
          <div class="card-body gap-2">
            <div class="flex items-start justify-between gap-2">
              <a [routerLink]="['/projects', project.id]" class="card-title link link-hover">{{ project.title }}</a>
              <span class="badge badge-outline">{{ project.voteCount }} votes</span>
            </div>
            <a [routerLink]="['/assignments', project.assignmentId]" class="badge badge-outline w-fit">
              {{ project.assignmentTitle }}
            </a>
            <div class="text-sm opacity-60">
              by {{ project.submitter.displayName }} · {{ project.createdAt | date: 'medium' }}
            </div>
            <div class="card-actions justify-end">
              <button class="btn btn-ghost btn-sm" (click)="editingId.set(project.id)">Edit</button>
              <button class="btn btn-error btn-outline btn-sm" (click)="delete(project)">Delete</button>
            </div>
          </div>
        </div>
      }
    }
  </div>
}
