<div class="flex flex-col items-center gap-4 py-16">
  @if (!error()) {
    <div class="spinner"></div>
    <p class="text-muted">Signing you in…</p>
  } @else {
    <p class="text-sm" style="color: var(--color-accent-200)">Sign-in failed. Please try again.</p>
    <a routerLink="/login" class="btn btn-primary">Back to login</a>
  }
</div>
