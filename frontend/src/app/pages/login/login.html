<div class="mx-auto flex justify-center" style="padding: 48px 16px">
  <form
    class="auth-card--login relative w-full overflow-hidden"
    style="max-width: 420px; border-radius: var(--radius-lg)"
    (ngSubmit)="submit()"
    #form="ngForm"
  >
    <div class="orb absolute" style="width: 160px; height: 160px; top: -70px; right: -50px; opacity: 0.5"></div>
    <div class="relative" style="padding: 40px 36px 36px">
      <a routerLink="/" class="mb-7 flex items-center gap-2.5" style="text-decoration: none; color: inherit; font: 500 16px var(--font-heading)">
        <app-brand-mark [size]="24" />
        <span>funbuild<span style="color: var(--color-accent-300)">.dev</span></span>
      </a>
      <h2 style="margin-bottom: 6px">Welcome back</h2>
      <p class="mb-5.5 text-[13px]" style="color: rgba(233, 233, 237, 0.55)">Log in to submit projects and vote.</p>

      @if (error()) {
        <div class="mb-3.5 text-sm" style="color: var(--color-accent-200)">{{ error() }}</div>
      }

      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" class="input" name="email" placeholder="you@team.dev" [(ngModel)]="email" required />
      </div>
      <div class="field mt-3">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" class="input" name="password" placeholder="••••••••" [(ngModel)]="password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-4.5" [disabled]="form.invalid || loading()">Log in</button>

      <div class="my-4.5 flex items-center gap-2.5 text-[11px]" style="color: rgba(233, 233, 237, 0.4)">
        <div class="h-px flex-1" style="background: var(--color-divider)"></div>
        or
        <div class="h-px flex-1" style="background: var(--color-divider)"></div>
      </div>

      <a [href]="oauthUrl('github')" class="btn btn-secondary btn-block gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.5-1.11-1.5-.9-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.34 1.12 2.91.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.2 9.2 0 0 1 5 0c1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.6.69.5A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2z" />
        </svg>
        Continue with GitHub
      </a>
      <a [href]="oauthUrl('google')" class="btn btn-secondary btn-block mt-2 gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.35 11.1h-9.17v2.83h5.28c-.23 1.4-1.6 4.1-5.28 4.1-3.18 0-5.78-2.63-5.78-5.87s2.6-5.87 5.78-5.87c1.81 0 3.03.77 3.72 1.44l2.54-2.45C16.96 3.6 14.9 2.7 12.18 2.7 6.9 2.7 2.6 6.98 2.6 12.16s4.3 9.46 9.58 9.46c5.53 0 9.2-3.89 9.2-9.36 0-.63-.07-1.11-.17-1.16z" />
        </svg>
        Continue with Google
      </a>

      <p class="mt-7 text-center text-xs" style="color: rgba(233, 233, 237, 0.55)">
        No account yet? <a routerLink="/register">Sign up</a>
      </p>
    </div>
  </form>
</div>
