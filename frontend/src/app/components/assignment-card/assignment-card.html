<a
  [routerLink]="['/assignments', assignment().id]"
  class="card elev-md h-full transition hover:brightness-110"
  style="background: var(--color-surface); text-decoration: none; color: inherit"
>
  <div class="flex items-center justify-between gap-2">
    <span class="tag" [class]="statusTagClass[assignment().status]" style="text-transform: uppercase; font-weight: 600; letter-spacing: 0.06em">
      {{ assignment().status }}
    </span>
    @if (assignment().status === 'ACTIVE') {
      <span class="text-muted text-[11px]">{{ timeLeft(assignment().endAt) }}</span>
    }
  </div>
  <div class="card-title">{{ assignment().title }}</div>
  <p class="card-body line-clamp-3">{{ assignment().description }}</p>
  <div class="card-meta">by {{ assignment().createdBy.displayName }}</div>
</a>
