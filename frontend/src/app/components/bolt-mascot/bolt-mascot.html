<svg
  [attr.width]="width()"
  [attr.height]="height()"
  viewBox="0 0 150 158"
  style="flex: none"
  aria-hidden="true"
>
  <defs>
    <radialGradient id="boltShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="boltTorsoGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#eceef7" />
      <stop offset="50%" stop-color="#d9dae6" />
      <stop offset="100%" stop-color="#b9bcd0" />
    </linearGradient>
    <linearGradient id="boltHeadGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#eceef7" />
      <stop offset="52%" stop-color="#d9dae6" />
      <stop offset="100%" stop-color="#bcbfd2" />
    </linearGradient>
    <linearGradient id="boltArmGradL" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e4e5ef" />
      <stop offset="100%" stop-color="#b9bcd0" />
    </linearGradient>
    <linearGradient id="boltArmGradR" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#e4e5ef" />
      <stop offset="100%" stop-color="#b9bcd0" />
    </linearGradient>
    <filter id="boltGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="75" cy="151" rx="39" ry="7" fill="url(#boltShadowGrad)" />

  <rect x="32" y="140" width="24" height="12" rx="5" fill="#272a3c" />
  <rect x="94" y="140" width="24" height="12" rx="5" fill="#272a3c" />
  <rect x="41" y="130" width="13" height="12" rx="3" fill="#a8aabd" />
  <rect x="96" y="130" width="13" height="12" rx="3" fill="#a8aabd" />

  <rect x="23" y="124" width="104" height="7" rx="3" fill="var(--color-accent)" />

  <rect x="8" y="98" width="16" height="16" rx="5" fill="var(--color-accent)" />
  <rect x="126" y="98" width="16" height="16" rx="5" fill="var(--color-accent)" />

  <rect x="11" y="68" width="14" height="32" rx="5" fill="url(#boltArmGradL)" />
  <rect x="125" y="68" width="14" height="32" rx="5" fill="url(#boltArmGradR)" />

  <rect x="9" y="54" width="17" height="16" rx="5" fill="#a8aabd" />
  <rect x="124" y="54" width="17" height="16" rx="5" fill="#a8aabd" />

  <rect x="26" y="64" width="98" height="62" rx="18" fill="url(#boltTorsoGrad)" />
  <rect x="44" y="76" width="62" height="34" rx="8" fill="#272a3c" />
  <rect x="48" y="80" width="54" height="26" rx="6" fill="#cfc7ff" filter="url(#boltGlow)" />

  <rect x="67" y="52" width="16" height="12" rx="4" fill="#a8aabd" />

  <rect x="6" y="20" width="12" height="26" rx="4" fill="var(--color-accent)" />
  <rect x="132" y="20" width="12" height="26" rx="4" fill="var(--color-accent)" />

  <rect x="17" y="8" width="116" height="46" rx="15" fill="url(#boltHeadGrad)" />
  <rect x="14" y="20" width="122" height="24" rx="9" fill="#272a3c" />
  <rect x="39" y="24" width="15" height="15" rx="5" fill="#cfc7ff" filter="url(#boltGlow)" />
  <rect x="96" y="24" width="15" height="15" rx="5" fill="#cfc7ff" filter="url(#boltGlow)" />
</svg>
