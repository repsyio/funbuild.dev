<form class="card elev-md gap-4 p-5.5" style="background: var(--color-surface)" (ngSubmit)="submit()" #form="ngForm">
  <h3 class="m-0">{{ existingProject() ? 'Edit submission' : 'Submit a project' }}</h3>

  @if (error()) {
    <div class="text-sm" style="color: var(--color-accent-200)">{{ error() }}</div>
  }

  <div class="field">
    <label for="pf-title">Title</label>
    <input id="pf-title" type="text" class="input" name="title" placeholder="e.g. NeonKart" [(ngModel)]="title" required maxlength="200" />
  </div>

  <div class="field">
    <label for="pf-description">Description</label>
    <textarea id="pf-description" class="input" name="description" rows="3" placeholder="What did you build, and how does it work?" [(ngModel)]="description" required></textarea>
  </div>

  <div class="grid gap-3.5 sm:grid-cols-2">
    <div class="field">
      <label for="pf-showcase">Showcase URL</label>
      <input id="pf-showcase" type="url" class="input" name="showcaseUrl" placeholder="https://…" [(ngModel)]="showcaseUrl" required />
    </div>
    <div class="field">
      <label for="pf-repo">Git repo URL <span class="opacity-60">(optional)</span></label>
      <input id="pf-repo" type="url" class="input" name="gitRepoUrl" placeholder="https://github.com/…" [(ngModel)]="gitRepoUrl" />
    </div>
  </div>

  <app-tech-label-select [(labels)]="techLabels" />

  <div class="flex justify-end gap-2">
    @if (existingProject()) {
      <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancel</button>
    }
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
      {{ existingProject() ? 'Save changes' : 'Submit project' }}
    </button>
  </div>
</form>
