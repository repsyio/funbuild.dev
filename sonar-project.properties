# Analyze both applications from the repository root so their coverage can be
# imported into the same SonarCloud project.
sonar.projectKey=repsyio_funbuild.dev
sonar.organization=repsy

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/target/**,frontend/**/*.spec.ts
sonar.coverage.exclusions=frontend/src/main.ts,frontend/src/app/app.config.ts,frontend/src/app/app.routes.ts,frontend/src/environments/**

sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# The standalone scanner needs the classes produced by Maven for Java analysis.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
